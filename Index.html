<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Secure Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 85%; max-width: 360px; }
        h2 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; color: white; }
        .btn-login { background-color: #2ecc71; }
        .btn-reset { background-color: #e74c3c; }
        .message { padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>System Login</h2>
    <div id="messageBox" class="message"></div>

    <form id="loginForm">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter Username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Password">
        </div>
        <div class="btn-group">
            <button type="button" class="btn-login" onclick="validateLogin()">Login</button>
            <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
        </div>
    </form>
</div>

<script>
    function validateLogin() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;
        var msgBox = document.getElementById('messageBox');

        // Input Validation
        if (user === "" || pass === "") {
            msgBox.textContent = "Error: All fields are required!";
            msgBox.style.backgroundColor = "#f8d7da";
            msgBox.style.color = "#721c24";
            msgBox.style.display = "block";
        } else if (user === "admin" && pass === "password123") {
            msgBox.textContent = "Success! Welcome back.";
            msgBox.style.backgroundColor = "#d4edda";
            msgBox.style.color = "#155724";
            msgBox.style.display = "block";
        } else {
            msgBox.textContent = "Error: Invalid credentials.";
            msgBox.style.backgroundColor = "#f8d7da";
            msgBox.style.color = "#721c24";
            msgBox.style.display = "block";
        }
    }

    function resetForm() {
        document.getElementById('loginForm').reset();
        document.getElementById('messageBox').style.display = "none";
    }
</script>
</body>
</html>
